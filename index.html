<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>דשבורד קישורים</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2563eb">
  <style>
    :root {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --radius: 8px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 16px;
      line-height: 1.4;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    h1 { font-size: 1.25rem; font-weight: 600; }
    .status {
      font-size: 0.75rem;
      padding: 3px 8px;
      border-radius: 12px;
      background: #e2e8f0;
      color: var(--text-muted);
    }
    .status.online { background: #dcfce7; color: #166534; }
    .status.offline { background: #fee2e2; color: #991b1b; }
    .search-box {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      margin-bottom: 16px;
      font-size: 0.95rem;
      outline: none;
      background: var(--card-bg);
    }
    .search-box:focus { border-color: var(--primary); }
    .categories {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 12px;
    }
    .category-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }
    .category-header {
      padding: 10px 14px;
      font-size: 0.95rem;
      font-weight: 600;
      background: #f1f5f9;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      user-select: none;
    }
    .category-body {
      padding: 8px 12px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .chip {
      text-decoration: none;
      color: var(--text);
      background: #f8fafc;
      border: 1px solid var(--border);
      padding: 5px 10px;
      border-radius: 16px;
      font-size: 0.85rem;
      transition: all 0.15s ease;
      display: inline-flex;
      align-items: center;
    }
    .chip:hover {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <div class="header">
    <h1>מרכז קישורים</h1>
    <span id="netStatus" class="status">בודק חיבור...</span>
  </div>

  <input type="text" id="searchInput" class="search-box" placeholder="חיפוש מהיר...">

  <div id="container" class="categories">טוען נתונים...</div>

  <script>
    const SHEET_ID = '1uNJ1JqjcHdCpi4YVe1gjIxBFPPfoNgCiel-_rh1YR7w';
    const SHEET_NAME = 'ראשי';
    const CACHE_KEY = 'DASHBOARD_CACHE_' + SHEET_NAME;
    const CSV_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(SHEET_NAME)}`;

    const container = document.getElementById('container');
    const netStatus = document.getElementById('netStatus');
    const searchInput = document.getElementById('searchInput');

    function updateOnlineStatus() {
      if (navigator.onLine) {
        netStatus.textContent = 'מחובר';
        netStatus.className = 'status online';
      } else {
        netStatus.textContent = 'מצב לא מקוון';
        netStatus.className = 'status offline';
      }
    }
    window.addEventListener('online', updateOnlineStatus);
    window.addEventListener('offline', updateOnlineStatus);
    updateOnlineStatus();

    function parseCSV(text) {
      const rows = [];
      let row = [], entry = '', inQuotes = false;
      for (let i = 0; i < text.length; i++) {
        let c = text[i], next = text[i+1];
        if (c === '"') {
          if (inQuotes && next === '"') { entry += '"'; i++; }
          else { inQuotes = !inQuotes; }
        } else if (c === ',' && !inQuotes) {
          row.push(entry.trim()); entry = '';
        } else if ((c === '\r' || c === '\n') && !inQuotes) {
          if (c === '\r' && next === '\n') i++;
          row.push(entry.trim());
          if (row.some(r => r !== '')) rows.push(row);
          row = []; entry = '';
        } else {
          entry += c;
        }
      }
      if (entry || row.length) { row.push(entry.trim()); rows.push(row); }
      return rows;
    }

    function renderData(data) {
      if (!data || !data.length) {
        container.innerHTML = '<div>אין נתונים להצגה</div>';
        return;
      }
      const groups = {};
      data.forEach(item => {
        const cat = item.category || 'כללי';
        if (!groups[cat]) groups[cat] = [];
        groups[cat].push(item);
      });

      let html = '';
      for (const [cat, items] of Object.entries(groups)) {
        html += `
          <div class="category-card" data-cat="${cat}">
            <div class="category-header" onclick="this.nextElementSibling.classList.toggle('hidden')">
              <span>${cat}</span>
              <small>${items.length}</small>
            </div>
            <div class="category-body">
              ${items.map(i => `<a href="${i.url}" target="_blank" rel="noopener" class="chip" data-label="${i.title}">${i.title}</a>`).join('')}
            </div>
          </div>
        `;
      }
      container.innerHTML = html;
    }

    function processSheetRows(rows) {
      if (rows.length < 2) return [];
      const headers = rows[0].map(h => h.trim().toLowerCase());
      const titleIdx = headers.findIndex(h => h.includes('שם') || h.includes('כותרת') || h.includes('title'));
      const urlIdx = headers.findIndex(h => h.includes('קישור') || h.includes('url') || h.includes('link'));
      const catIdx = headers.findIndex(h => h.includes('קטגוריה') || h.includes('נושא') || h.includes('category'));

      return rows.slice(1).map(r => ({
        title: r[titleIdx >= 0 ? titleIdx : 0] || '',
        url: r[urlIdx >= 0 ? urlIdx : 1] || '#',
        category: r[catIdx >= 0 ? catIdx : 2] || 'כללי'
      })).filter(i => i.title && i.url && i.url !== '#');
    }

    // 1. טעינה מיידית מהמטמון
    const cached = localStorage.getItem(CACHE_KEY);
    if (cached) {
      try {
        renderData(JSON.parse(cached));
      } catch (e) {}
    }

    // 2. רענון שקט מהרשת
    if (navigator.onLine) {
      fetch(CSV_URL)
        .then(res => res.text())
        .then(csvText => {
          const rows = parseCSV(csvText);
          const formatted = processSheetRows(rows);
          if (formatted.length) {
            localStorage.setItem(CACHE_KEY, JSON.stringify(formatted));
            renderData(formatted);
          }
        })
        .catch(() => {});
    }

    // חיפוש
    searchInput.addEventListener('input', e => {
      const q = e.target.value.toLowerCase();
      document.querySelectorAll('.category-card').forEach(card => {
        let hasMatch = false;
        card.querySelectorAll('.chip').forEach(chip => {
          const match = chip.textContent.toLowerCase().includes(q);
          chip.style.display = match ? 'inline-flex' : 'none';
          if (match) hasMatch = true;
        });
        card.style.display = hasMatch ? 'block' : 'none';
      });
    });

    // רישום Service Worker
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>
</body>
</html>

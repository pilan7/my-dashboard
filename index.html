<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#173b5e">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      background-color: #ffffff;
      color: #333333;
      padding: 16px 24px;
    }

    /* Top Nav */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .brand {
      font-family: "Brush Script MT", cursive, sans-serif;
      font-size: 26px;
      font-weight: bold;
    }

    .top-menu {
      display: flex;
      align-items: center;
      gap: 16px;
      font-size: 14px;
      color: #555;
    }

    .top-menu a {
      text-decoration: none;
      color: inherit;
    }

    /* Quick Chips Bar */
    .quick-chips {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-start;
      gap: 8px;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 1px solid #ebebeb;
    }

    .chip-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 14px;
      background: #ffffff;
      border: 1px solid #cfd8dc;
      border-radius: 16px;
      color: #2c3e50;
      text-decoration: none;
      font-size: 13px;
      transition: background 0.15s, border-color 0.15s;
    }

    .chip-btn:hover {
      background: #f1f5f9;
      border-color: #94a3b8;
    }

    /* Columns Layout */
    .columns-container {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-start;
      gap: 16px;
    }

    .category-col {
      width: 190px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    /* Category Accordion Header Button */
    .cat-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      background-color: #173b5e;
      color: #ffffff;
      font-size: 14px;
      font-weight: 600;
      padding: 8px 12px;
      border-radius: 4px;
      border: none;
      cursor: pointer;
      text-align: right;
      transition: background 0.2s;
    }

    .cat-header:hover {
      background-color: #112a45;
    }

    .cat-arrow {
      font-size: 11px;
      transition: transform 0.2s ease;
      display: inline-block;
    }

    .cat-header.collapsed .cat-arrow {
      transform: rotate(0deg); /* ◄ פונה שמאלה */
    }

    .cat-header:not(.collapsed) .cat-arrow {
      transform: rotate(-90deg); /* ▼ פונה מטה */
    }

    /* Link Buttons */
    .cat-links {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .cat-links.hidden {
      display: none;
    }

    .link-card {
      display: block;
      width: 100%;
      text-align: center;
      background-color: #f7f9fa;
      border: 1px solid #e2e8f0;
      border-radius: 4px;
      padding: 7px 8px;
      color: #2d3748;
      text-decoration: none;
      font-size: 13px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: background 0.15s, border-color 0.15s;
    }

    .link-card:hover {
      background-color: #edf2f7;
      border-color: #cbd5e1;
      color: #1a202c;
    }

    .link-card.divider {
      border: 1px dashed #cbd5e1;
      background: transparent;
      font-weight: 600;
      color: #475569;
    }
  </style>
</head>
<body>

  <!-- Top bar -->
  <div class="top-bar">
    <div class="brand">Perez</div>
    <div class="top-menu">
      <span>🔍</span>
      <a href="#">ארכיון</a>
      <a href="#">מילואים</a>
      <a href="#">חדשות ותקשורת</a>
      <a href="#" style="font-weight: bold; color: #111;">ראשי</a>
    </div>
  </div>

  <!-- Top quick buttons -->
  <div class="quick-chips" id="quickChips"></div>

  <!-- Main categories columns -->
  <div class="columns-container" id="columnsContainer"></div>

  <script>
    const CSV_URL = 'https://docs.google.com/spreadsheets/d/1uNJ1JqjcHdCpi4YVe1gjIxBFPPfoNgCiel-_rh1YR7w/gviz/tq?tqx=out:csv&sheet=ראשי';
    const CACHE_KEY = 'dashboard_sheet_cache';

    // קטגוריות שיוצגו פתוחות כברירת מחדל כמו בצילום המסך
    const DEFAULT_OPEN = ['שוטף', 'כללי'];

    function parseCSV(text) {
      const lines = text.trim().split('\n');
      const rows = [];
      for (let line of lines) {
        if (!line.trim()) continue;
        const cols = [];
        let cur = '', insideQuotes = false;
        for (let i = 0; i < line.length; i++) {
          const char = line[i];
          if (char === '"' && (i === 0 || line[i-1] !== '\\')) {
            insideQuotes = !insideQuotes;
          } else if (char === ',' && !insideQuotes) {
            cols.push(cur.trim().replace(/^"|"$/g, ''));
            cur = '';
          } else {
            cur += char;
          }
        }
        cols.push(cur.trim().replace(/^"|"$/g, ''));
        rows.push(cols);
      }
      return rows;
    }
